<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b2b">
<title>Café Drāko | Digital Menu</title>
<style>
:root{--green:#123b2b;--green2:#1e523b;--cream:#f6f0e3;--paper:#f5edcf;--gold:#d9bb76;--ink:#171713;--muted:#625e52;--line:#e2d7b8;--red:#ed3d20}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#10110f;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(145deg,#0b1711,#153d2b);color:var(--cream);padding:24px 18px 22px;text-align:center;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;justify-content:center;gap:13px;max-width:680px;margin:auto}
.brand img{width:66px;height:66px;object-fit:cover;border-radius:50%;border:1px solid #bda05c}
.brandname{font-family:Georgia,serif;letter-spacing:.13em;font-size:clamp(25px,6vw,37px);line-height:1.05;color:#f5e4b6}
.brandname small{display:block;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.35em;margin-top:7px;color:#fff5dc}
.tagline{margin:18px 0 0;color:#e9d8aa;font-family:Georgia,serif;font-style:italic}
.wrap{max-width:900px;margin:auto;padding:18px 14px 60px;background:#10110f}
.intro{text-align:center;padding:10px 0 18px}.intro h1{font-family:system-ui,sans-serif;font-weight:850;color:#f3dfac;font-size:29px;margin:4px 0;letter-spacing:.02em}.intro p{color:#d4cbb6;margin:8px 0 0;font-size:14px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(16,17,15,.96);padding:9px 0 12px;backdrop-filter:blur(8px)}
.tab{border:1px solid var(--gold);background:transparent;color:#f4e5bd;border-radius:999px;padding:12px;font-weight:750;font-size:14px}.tab.active{background:var(--gold);color:#16251b}
.categories{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px;scrollbar-width:thin}.cat{white-space:nowrap;border:1px solid #bba56c;background:#f5edcf;color:#173d2b;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:650}
.cat.active{background:#e94325;border-color:#e94325;color:#fff8e9;font-weight:800}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;border-bottom:2px solid #d8b96d;padding:15px 14px 10px;background:#f5edcf;border-radius:16px 16px 0 0}
.section-head h2{font-family:system-ui,sans-serif;color:#e94325;font-size:23px;font-weight:900;margin:0;text-transform:uppercase;letter-spacing:.015em}
.section-head span{font-size:12px;color:var(--muted)}
.menu-section{margin:10px 0 24px}.category-title{font-family:Georgia,serif;color:var(--green);font-size:20px;margin:24px 0 8px}
.menu-table-head,.menu-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(62px,.8fr) minmax(74px,1fr);gap:8px;align-items:center}
.menu-table-head{background:#e4eadf;border-radius:8px;padding:10px 8px;color:var(--green);font-size:11px;font-weight:800}
.menu-row{padding:13px 8px;border-bottom:1px solid var(--line);font-size:13px}
.menu-name{font-weight:650;line-height:1.35}
.menu-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-top:4px;font-weight:400}
.menu-price{text-align:right;color:var(--green);font-size:13px;font-weight:750;white-space:nowrap}
.single-price{grid-column:2/4;text-align:right;color:var(--green);font-weight:750}
.price-pending{background:#fff0f0;border:2px solid var(--red);border-radius:8px;padding:10px;margin:8px 0}
.price-pending .menu-price{color:var(--red)}


.category-block{margin-bottom:22px;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.22);background:#f5edcf}
.category-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(140px,.9fr);align-items:stretch;background:#f5edcf}
.category-items{min-width:0;padding:0 0 4px}
.category-photo-wrap{min-width:0;display:flex;align-items:stretch;justify-content:center;background:#f5edcf;padding:8px 8px 8px 0}
.category-photo{width:100%;height:100%;min-height:220px;max-height:440px;object-fit:cover;object-position:center;border-radius:12px;display:block;background:#e1d3b0}
.menu-name{overflow-wrap:anywhere}
@media(max-width:520px){.category-body{grid-template-columns:minmax(0,1.35fr) minmax(105px,.8fr)}.category-photo-wrap{padding:8px 7px 8px 0}.category-photo{min-height:180px;max-height:360px}.paired-price-item{grid-template-columns:minmax(0,1.2fr) minmax(54px,.8fr) minmax(62px,.9fr);gap:4px;padding:12px 7px}.paired-price-item .menu-name{font-size:11px}.paired-prices span{font-size:9px}.paired-prices strong{font-size:12px}.single-item{padding:12px 7px;gap:6px}.single-item .menu-name{font-size:12px}.single-price{font-size:12px}}
@media(max-width:360px){.category-body{grid-template-columns:minmax(0,1fr) 100px}.category-photo{min-height:160px}.paired-price-item{grid-template-columns:minmax(0,1fr) 54px 58px}}
.paired-price-list{margin-bottom:14px;border-radius:14px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,.18)}
.paired-price-item{display:grid;grid-template-columns:minmax(0,2fr) minmax(72px,.9fr) minmax(86px,1fr);gap:8px;align-items:center;padding:14px 12px;border-bottom:1px solid var(--line);background:#f5edcf}
.paired-price-item:first-child{border-radius:14px 14px 0 0}
.paired-price-item .menu-name{font-size:14px;font-weight:750;color:var(--green);line-height:1.3}
.paired-prices{display:contents}
.paired-prices span{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:10px;text-align:right}
.paired-prices strong{color:var(--green);font-size:14px}
.single-price-list{margin-top:14px;border-radius:14px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,.18)}
.single-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:13px 12px;border-bottom:1px solid var(--line);background:#f5edcf}
.single-item .menu-name{font-size:14px;font-weight:650}
.single-price{font-size:14px;font-weight:750;color:var(--green);white-space:nowrap;text-align:right}
@media(max-width:380px){.paired-price-item{grid-template-columns:minmax(0,1.5fr) minmax(60px,.8fr) minmax(70px,.9fr);gap:5px;padding:12px 8px}.paired-prices span{font-size:9px}.paired-prices strong{font-size:12px}.paired-price-item .menu-name{font-size:12px}}
.notice{background:#f5edcf;color:#526054;border:1px solid #d9c38b;border-radius:12px;padding:12px;font-size:12px;line-height:1.5;margin:14px 0}
footer{text-align:center;padding:22px 12px;background:#153d2b;border-top:3px solid var(--gold);color:#e9d8aa;font-size:12px}footer strong{font-family:Georgia,serif;letter-spacing:.1em}
.hidden{display:none!important}
@media(min-width:700px){.wrap{padding-left:24px;padding-right:24px}.menu-row{grid-template-columns:minmax(0,2.4fr) minmax(90px,.8fr) minmax(110px,1fr);font-size:14px}.menu-table-head{grid-template-columns:minmax(0,2.4fr) minmax(90px,.8fr) minmax(110px,1fr);font-size:12px}}

/* Cafe Drāko final responsive brand pass */
:root{--green:#123b2b;--green2:#1e523b;--cream:#f6f0e3;--paper:#f5edcf;--gold:#d9bb76;--ink:#19271f;--muted:#625e52;--line:#e2d7b8;--red:#ed4329}
html,body{width:100%;max-width:100%;min-width:0;margin:0;overflow-x:hidden;background:#0d291e!important}
body{color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(145deg,#0d291e,#174431)!important;color:#f5edcf;border-bottom:3px solid var(--gold);width:100%;box-sizing:border-box}
.wrap{width:100%;max-width:980px;box-sizing:border-box;margin:0 auto;padding:18px 14px 56px;background:#0d291e!important;min-width:0}
.intro{width:100%;max-width:100%;box-sizing:border-box;text-align:center;padding:10px 0 18px}
.intro h1{max-width:100%;font-size:clamp(24px,4vw,36px);overflow-wrap:anywhere}
.intro p{max-width:100%;overflow-wrap:anywhere}
.tabs{width:100%;box-sizing:border-box;background:rgba(13,41,30,.97)!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tab{min-width:0;white-space:normal}
.categories{width:100%;max-width:100%;box-sizing:border-box;overflow-x:auto;overscroll-behavior-x:contain}
.content,.menu-content,.section-content{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
.category-block{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
.section-head{width:100%;max-width:100%;box-sizing:border-box;min-width:0}
.section-head h2{font-size:clamp(20px,3vw,28px);overflow-wrap:anywhere}
.category-body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr);align-items:stretch;width:100%;min-width:0;box-sizing:border-box;overflow:hidden}
.category-items{min-width:0;width:100%;box-sizing:border-box}
.category-photo-wrap{min-width:0;width:100%;box-sizing:border-box;padding:8px 8px 8px 0;display:flex;align-self:stretch}
.category-photo{display:block;width:100%;height:100%;min-height:0;max-height:none;object-fit:cover;object-position:center;border-radius:12px;background:#e1d3b0}
.paired-price-item{grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,.9fr);min-width:0;box-sizing:border-box}
.paired-prices{min-width:0}
.paired-prices span{min-width:0;overflow-wrap:anywhere}
.single-item{min-width:0;box-sizing:border-box}
.menu-name{overflow-wrap:anywhere;word-break:normal}
img{max-width:100%}
@media(max-width:640px){
 .wrap{padding:14px 10px 40px}
 .category-body{grid-template-columns:minmax(0,1.3fr) minmax(100px,.8fr)}
 .category-photo-wrap{padding:7px 7px 7px 0}
 .category-photo{min-height:0;height:100%;max-height:none;object-fit:cover}
 .paired-price-item{grid-template-columns:minmax(0,1.15fr) minmax(52px,.8fr) minmax(58px,.9fr);gap:4px;padding:11px 7px}
 .paired-price-item .menu-name{font-size:12px}
 .paired-prices span{font-size:9px}
 .paired-prices strong{font-size:12px}
 .section-head{padding:13px 12px 9px}
}
@media(max-width:380px){
 .wrap{padding-left:7px;padding-right:7px}
 .category-body{grid-template-columns:minmax(0,1fr) 94px}
 .paired-price-item{grid-template-columns:minmax(0,1fr) 50px 55px;gap:3px;padding:10px 5px}
 .paired-price-item .menu-name{font-size:11px}
 .paired-prices span{font-size:8px}
 .paired-prices strong{font-size:11px}
 .single-item{padding:10px 6px}
}


/* Approved Cafe Drāko banner: full brand, responsive without cropping */
.drako-brand-header{width:100%;box-sizing:border-box;padding:0;margin:0;background:#0d291e!important;border-bottom:3px solid #d9bb76;display:flex;justify-content:center;align-items:center;overflow:hidden}
.drako-brand-banner{display:block;width:100%;max-width:1500px;height:auto;max-height:none;object-fit:contain;object-position:center;margin:0 auto}
@media(max-width:600px){
 .drako-brand-header{padding:0}
 .drako-brand-banner{width:100%;height:auto;max-height:none;object-fit:contain}
}

</style>

function render(data,catsEl,contentEl,prefix){
 const photoMap = prefix==='bev'
   ? ['iced_coffee','mocktail','iced_coffee','mocktail','iced_coffee','mocktail','iced_coffee','mocktail']
   : ['soup','salad','fries','burger','pizza','pasta','rice','fries','burger'];
 catsEl.innerHTML=data.map((c,i)=>`<button class="cat ${i===0?'active':''}" data-cat="${prefix}-${i}">${esc(c.name)}</button>`).join('');
 contentEl.innerHTML=data.map((c,i)=>{
   const paired = c.items.filter(it=>String(it[1]||'').includes('/'));
   const single = c.items.filter(it=>!String(it[1]||'').includes('/'));
   const photo=photoMap[i%photoMap.length];
   const pairedMarkup = paired.length ? `<div class="paired-price-list">${paired.map(it=>{
      const parts=String(it[1]).replace(/₹/g,'').split('/').map(x=>x.trim());
      return `<div class="paired-price-item"><div class="menu-name">${esc(it[0])}</div><div class="paired-prices"><span>Veg Price <strong>₹${esc(parts[0])}</strong></span><span>Non-Veg Price <strong>₹${esc(parts[1])}</strong></span></div></div>`;
   }).join('')}</div>` : '';
   const singleMarkup = single.length ? `<div class="single-price-list">${single.map(it=>`<div class="single-item"><div><div class="menu-name">${esc(it[0])}</div>${it[2]?`<div class="menu-desc">${esc(it[2])}</div>`:''}</div><div class="single-price">₹${esc(String(it[1]).replace(/₹/g,'').trim())}</div></div>`).join('')}</div>` : '';
   return `<section id="${prefix}-${i}" class="category-block">
     <div class="section-head"><h2>${esc(c.name)}</h2><span>${c.items.length} items</span></div>
     <div class="category-body">
       <div class="category-items">${pairedMarkup}${singleMarkup}</div>
       <div class="category-photo-wrap"><img class="category-photo" src="${embeddedImages[photo]}" alt="${esc(c.name)} food photography" loading="lazy"></div>
     </div>
   </section>`;
 }).join('');
 catsEl.querySelectorAll('.cat').forEach(btn=>btn.addEventListener('click',()=>{catsEl.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.cat).scrollIntoView({behavior:'smooth',block:'start'})}));
}
render(beverages,document.getElementById('bev-cats'),document.getElementById('bev-content'),'bev');
render(food,document.getElementById('food-cats'),document.getElementById('food-content'),'food');
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 document.getElementById('beverages').classList.toggle('hidden',btn.dataset.menu!=='beverages');
 document.getElementById('food').classList.toggle('hidden',btn.dataset.menu!=='food');
 window.scrollTo({top:0,behavior:'smooth'});
}));
</script>
</body></html>
